name: Crear APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'VolanteAndroid_proyecto_corregido.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev automake gettext

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip VolanteAndroid_proyecto_corregido.zip -d proyecto
          SPEC="$(find proyecto -name buildozer.spec -print -quit)"
          test -n "$SPEC"
          sed -i 's/^android.minapi = 23/android.minapi = 24/' "$SPEC"
          sed -i 's/^android.archs = .*/android.archs = arm64-v8a/' "$SPEC"

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade "pip<25.3"
          python -m pip install buildozer cython==0.29.34

      - name: Compilar APK
        run: |
          SPEC="$(find proyecto -name buildozer.spec -print -quit)"
          cd "$(dirname "$SPEC")"
          buildozer -v android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VolanteAndroid-APK
          path: proyecto/**/bin/*.apk
          if-no-files-found: error
          
