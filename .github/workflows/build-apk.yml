name: Crear APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/build-apk.yml'

jobs:
  construir:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Preparar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Configurar Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'adopt'
          java-version: '11'

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Buildozer y dependencias
        run: |
          python -m pip install --upgrade "pip<25.3"
          python -m pip install "setuptools<81" wheel
          python -m pip install buildozer cython==0.29.34

      - name: Compilar APK
        run: |
          sed -i 's/^android.minapi *= *.*/android.minapi = 24/' buildozer.spec
          sed -i 's/^android.archs *= *.*/android.archs = arm64-v8a/' buildozer.spec
          buildozer -v android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VolanteAndroid-APK
          path: bin/*.apk
          if-no-files-found: error
          
